<!--
  Announcement Bar — Clean Slate PW (Homepage Guide §4)
  Evergreen / quarterly seasonal message. Dismissible (30-day persistence).
  Change [data-variant] to invalidate prior dismissals when copy rotates.
-->
<div class="announcement" data-variant="default">
  <div class="announcement__inner">
    <span class="announcement__msg">
      <strong>New Customer Special:</strong> $50 off your first service of $300+.
      <a href="/free-estimate/" class="announcement__cta" data-cta="announcement_bar">
        Get Your Free Estimate &rarr;
      </a>
    </span>
    <button type="button" class="announcement__close" aria-label="Dismiss announcement">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
</div>
