      { "@type": "Question", "name": "¿Cuál es su horario?", "acceptedAnswer": { "@type": "Answer", "text": "Spin It Up Laundry está abierto de 6:00 AM a 11:00 PM, los 7 días de la semana, incluyendo todos los días festivos importantes. El último ciclo de lavado comienza a las 9:30 PM. Recomendamos llegar antes de las 9:00 PM para visitas nocturnas." } },
      { "@type": "Question", "name": "¿Dónde están ubicados?", "acceptedAnswer": { "@type": "Answer", "text": "Estamos ubicados en 3710 N Kimball Ave en el vecindario de Avondale, Chicago, Illinois 60618, en Kimball Ave entre Irving Park Rd y Addison St. Hay estacionamiento gratuito directamente frente a la lavandería." } },
      { "@type": "Question", "name": "¿Qué servicios ofrecen?", "acceptedAnswer": { "@type": "Answer", "text": "Ofrecemos cinco servicios de lavandería: autoservicio con 41 lavadoras y 52 secadoras incluyendo máquinas comerciales de 130 libras, lavado y doblado profesional desde $1.50 por libra, recogida y entrega por la aplicación Cents, servicios comerciales para negocios, y planchado de prendas." } },
      { "@type": "Question", "name": "¿Aceptan EBT?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. Spin It Up Laundry acepta pagos EBT para autoservicio de lavado y secado. Somos una de las pocas lavanderías en el área de Avondale que acepta EBT. El lavado y doblado, la recogida y entrega, y los servicios comerciales se pagan con tarjeta de crédito, débito, efectivo o tarjeta de lavandería." } },
      { "@type": "Question", "name": "¿Hay estacionamiento?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. Hay estacionamiento gratuito directamente frente a la lavandería en 3710 N Kimball Ave. También hay estacionamiento gratuito en la calle Kimball Ave y calles residenciales cercanas." } },
      { "@type": "Question", "name": "¿Cuál es la lavadora más grande que tienen?", "acceptedAnswer": { "@type": "Answer", "text": "Nuestras máquinas más grandes tienen capacidad de hasta 130 libras — las lavadoras más grandes de Chicago. Manejan edredones tamaño king, bolsas de dormir, cobijas grandes y cargas a granel que no caben en las lavadoras estándar." } },
      { "@type": "Question", "name": "¿Puedo lavar un edredón tamaño king?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. Nuestras lavadoras extra grandes (60–80 lb) y comerciales (130 lb) manejan edredones tamaño king fácilmente. Precio de tarifa fija en persona: edredón tamaño king es $18.00." } },
      { "@type": "Question", "name": "¿Necesito monedas?", "acceptedAnswer": { "@type": "Answer", "text": "No. Puede usar una tarjeta de lavandería recargable, tarjeta de crédito, débito, efectivo o EBT. Recargue su tarjeta de lavandería en el mostrador con cualquier método de pago y úsela en cualquier máquina." } },
      { "@type": "Question", "name": "¿Cuánto tiempo tarda el lavado y doblado?", "acceptedAnswer": { "@type": "Answer", "text": "La entrega estándar es al día siguiente. Si deja su ropa antes de las 10:00 AM, el servicio del mismo día está disponible a $1.75 por libra. Guardamos su orden hasta por 7 días sin cargo adicional." } },
      { "@type": "Question", "name": "¿Separan los colores y los blancos?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. Nuestros empleados clasifican cada orden por color, tipo de tela y temperatura antes de cargar. Los blancos, oscuros y colores se lavan por separado. Su ropa nunca se mezcla con la de otro cliente." } },
      { "@type": "Question", "name": "¿El tratamiento de manchas está incluido?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. El tratamiento de manchas previo al lavado está incluido en cada orden de lavado y doblado y de recogida y entrega sin cargo adicional. Usamos quitamanchas de grado comercial apropiados para cada tela." } },
      { "@type": "Question", "name": "¿Cómo funciona la recogida y entrega de lavandería?", "acceptedAnswer": { "@type": "Answer", "text": "Descargue la aplicación Cents gratis, ingrese su dirección, elija un horario de recogida y confirme su orden. Nuestro conductor recoge su ropa en su puerta. Lavamos, secamos y doblamos todo y entregamos de vuelta a su puerta, normalmente dentro de 24 horas. No necesita estar en casa." } },
      { "@type": "Question", "name": "¿A qué vecindarios entregan?", "acceptedAnswer": { "@type": "Answer", "text": "Actualmente entregamos en Avondale, Irving Park, Logan Square, Hermosa y Albany Park. La aplicación Cents confirma si su dirección está en nuestra zona de entrega. Si está cerca pero fuera del área, llame al (773) 654-1275." } },
      { "@type": "Question", "name": "¿Puedo programar una recogida recurrente?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. La aplicación Cents le permite configurar recogidas recurrentes semanales o quincenales. Su dirección, preferencias y método de pago se guardan. Puede pausar o cancelar en cualquier momento sin cargos." } },
      { "@type": "Question", "name": "¿Ofrecen lavandería comercial para negocios?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. Proveemos servicios de lavandería comercial para anfitriones de Airbnb, salones, gimnasios, restaurantes, hoteles pequeños y administradores de propiedades. Ofrecemos precios por volumen y recogida y entrega programada. Sin contratos a largo plazo. Llame al (773) 654-1275 para una cotización." } },
      { "@type": "Question", "name": "¿Hay un mínimo para cuentas comerciales?", "acceptedAnswer": { "@type": "Answer", "text": "No hay un mínimo estricto. Los descuentos por volumen comienzan aproximadamente en 50 libras por semana. Las órdenes por debajo se procesan a nuestras tarifas estándar, que siguen siendo competitivas para pequeños negocios." } },
      { "@type": "Question", "name": "¿Cuánto cuesta el lavado y doblado?", "acceptedAnswer": { "@type": "Answer", "text": "El precio estándar comienza en $1.50 por libra con un mínimo de 10 libras. El servicio del mismo día es $1.75 por libra. La recogida y entrega es $2.00 por libra al día siguiente y $2.25 por libra el mismo día. Tarifas fijas: edredón matrimonial/individual $12.00, edredón queen $15.00, edredón king $18.00, tapete 5x7 $20.00, tapete 5x10 $25.00, tapete grande $50.00, almohada $5.00." } },
      { "@type": "Question", "name": "¿El secado es realmente gratis los miércoles y jueves?", "acceptedAnswer": { "@type": "Answer", "text": "Sí. Cada miércoles y jueves, todas las secadoras son gratis cuando lava con nosotros. No hay tamaño mínimo de lavado. Lave cualquier carga y seque gratis de 6:00 AM a 11:00 PM. Es una promoción semanal permanente. Los martes son 1/2 de descuento en lavadoras." } }
