  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "What are your hours?", "acceptedAnswer": { "@type": "Answer", "text": "Spin It Up Laundry is open from 6:00 AM to 11:00 PM, seven days a week, including all major holidays. Our last wash cycle starts at 9:30 PM to ensure all loads complete before closing. We recommend arriving by 9:00 PM for evening visits to allow time for a full wash-and-dry cycle." } },
      { "@type": "Question", "name": "Where are you located?", "acceptedAnswer": { "@type": "Answer", "text": "We are located at 3710 N Kimball Ave in the Avondale neighborhood of Chicago, Illinois 60618. We are on Kimball Ave between Irving Park Rd and Addison St, near the intersection with School St. Free parking is available directly in front of the laundromat, and there is additional free street parking on Kimball Ave and surrounding residential streets." } },
      { "@type": "Question", "name": "What services do you offer?", "acceptedAnswer": { "@type": "Answer", "text": "We offer five laundry services: self-service laundry with 41 washers and 52 dryers including 130 lb commercial machines, professional wash-and-fold drop-off starting at $1.50 per pound, pickup and delivery ordered through the Cents app, commercial laundry services for businesses, and garment ironing and pressing." } },
      { "@type": "Question", "name": "Do you accept EBT?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Spin It Up Laundry accepts EBT (Electronic Benefit Transfer) payments for self-service washing and drying. We are one of the few laundromats in the Avondale area that accepts EBT. Swipe your EBT card at the front counter to load a laundry card and use it at any machine. Wash-and-fold, pickup and delivery, and commercial services are paid via credit card, debit card, cash, or laundry card." } },
      { "@type": "Question", "name": "Is there parking?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Free parking is available directly in front of the laundromat at 3710 N Kimball Ave. There is also free street parking on Kimball Ave and surrounding residential streets. We do not have a dedicated lot, but street parking is typically available within one block." } },
      { "@type": "Question", "name": "What is the largest washer you have?", "acceptedAnswer": { "@type": "Answer", "text": "Our largest machines hold up to 130 pounds — the biggest washers in Chicago. We have two commercial-capacity machines that handle king-size comforters, sleeping bags, large blankets, and bulk loads that will not fit in standard laundromat machines." } },
      { "@type": "Question", "name": "Can I wash a king-size comforter?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Our extra-large (60–80 lb) and commercial (130 lb) washers handle king-size comforters easily. We recommend the extra-large machine for most comforters and the commercial machine for thick, heavy king-size comforters or if you want to wash the comforter with pillows and sheets in the same load. Drop-off flat-rate pricing: king-size comforter is $18.00." } },
      { "@type": "Question", "name": "Do I need quarters?", "acceptedAnswer": { "@type": "Answer", "text": "No. You can use a reloadable laundry card, credit card, debit card, cash, or EBT. Load your laundry card at the front counter with any payment method and use it at any machine. The card stores your balance and works across all washers and dryers. Quarters are not required but are accepted if you prefer." } },
      { "@type": "Question", "name": "How long does wash and fold take?", "acceptedAnswer": { "@type": "Answer", "text": "Standard turnaround is next day. If you drop off before 10:00 AM, same-day service is available at the $1.75 per pound rate. We call or text you when your order is ready for pickup. If you cannot pick up on the expected day, we hold your order for up to 7 days at no additional charge." } },
      { "@type": "Question", "name": "Do you separate colors and whites?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Our attendants sort every order by color, fabric type, and washing temperature before loading. Whites, darks, and colors are washed separately. Delicate items are identified and handled with appropriate care. Your laundry is never mixed with another customer's clothes." } },
      { "@type": "Question", "name": "Is stain treatment included?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Pre-wash stain treatment is included on every wash-and-fold and pickup-and-delivery order at no extra charge. We use commercial-grade stain removers appropriate for each fabric type. If a stain cannot be fully removed, we will let you know when you pick up." } },
      { "@type": "Question", "name": "How does laundry pickup and delivery work?", "acceptedAnswer": { "@type": "Answer", "text": "Download the free Cents app on your phone, enter your address, select a pickup window, and confirm your order. Our driver picks up your laundry from your door during the selected time. We wash, dry, and fold everything at our facility. Your clean laundry is delivered back to your door, typically within 24 hours. You do not need to be home for pickup or delivery." } },
      { "@type": "Question", "name": "What neighborhoods do you deliver to?", "acceptedAnswer": { "@type": "Answer", "text": "We currently deliver to Avondale, Irving Park, Logan Square, Hermosa, and Albany Park on Chicago's Northwest Side. The Cents app confirms whether your address is in our delivery zone when you enter it. If you are nearby but outside the listed areas, call us at (773) 654-1275 — we may be able to arrange delivery." } },
      { "@type": "Question", "name": "Can I schedule a recurring pickup?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. The Cents app allows you to set up recurring pickups on a weekly or biweekly schedule. Your address, preferences, and payment method are saved so reordering takes a single tap. You can pause or cancel anytime without fees." } },
      { "@type": "Question", "name": "Do you offer commercial laundry for businesses?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. We provide commercial laundry services for Airbnb and vacation rental hosts, hair salons, gyms, restaurants, small hotels, and property management companies. We offer volume-based pricing, consistent turnaround, and scheduled pickup and delivery for commercial accounts. No long-term contracts required. Call (773) 654-1275 for a custom quote." } },
      { "@type": "Question", "name": "Is there a minimum for commercial accounts?", "acceptedAnswer": { "@type": "Answer", "text": "There is no strict minimum. Volume-based pricing discounts begin at approximately 50 lb per week. Orders below that threshold are processed at our standard wash-and-fold rates, which are still competitive for small businesses like Airbnb hosts with one or two properties." } },
      { "@type": "Question", "name": "How much does wash and fold cost?", "acceptedAnswer": { "@type": "Answer", "text": "Standard wash-and-fold pricing starts at $1.50 per pound with a 10 lb minimum. Same-day service is $1.75 per pound for orders dropped off before 10:00 AM. Pickup and delivery is $2.00 per pound next day and $2.25 per pound same day. Comforters are priced at a flat rate: full/twin $12.00, queen $15.00, king $18.00. Other fixed-price items: rug 5x7 $20.00, rug 5x10 $25.00, large rug $50.00, pillow $5.00. Stain treatment is included on every order." } },
      { "@type": "Question", "name": "Is drying really free on Wednesday and Thursday?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Free Dry is our Wednesday and Thursday special. On Wednesday and Thursday, all dryers at Spin It Up Laundry are free when you wash with us. There is no minimum wash size. Wash any load on any machine and dry for free in any dryer, any size, all day from 6:00 AM to 11:00 PM. (Tuesday is our 1/2 Off Washers day.)" } }
    ]
