<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Spin It Up Laundry — Albany Park Pickup &amp; Delivery</title>
  <desc id="d">Albany Park neighborhood with three-flats and street-level shops along a busy commercial avenue</desc>
  
<defs>
  <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A1A3D"/>
    <stop offset="100%" stop-color="#142A55"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="78%" cy="18%" r="65%">
    <stop offset="0%" stop-color="#D89A55" stop-opacity="0.35"/>
    <stop offset="35%" stop-color="#3A6FB0" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0A1A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bgVignette" cx="50%" cy="50%" r="80%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#142A55" stop-opacity="0"/>
    <stop offset="60%" stop-color="#091532" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#040A1F" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3D4A5C"/>
    <stop offset="100%" stop-color="#A8B5C5"/>
  </linearGradient>
  <linearGradient id="vanBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#576CBC"/>
    <stop offset="100%" stop-color="#19376D"/>
  </linearGradient>
  <linearGradient id="signGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F8F4EC"/>
    <stop offset="100%" stop-color="#E4DDC9"/>
  </linearGradient>
  <linearGradient id="skylineGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1A2C53"/>
    <stop offset="100%" stop-color="#0E1D40"/>
  </linearGradient>

  <filter id="ds-soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dy="14"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ds-tight" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dy="6"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>
  
  <rect width="1600" height="900" fill="url(#bgBase)"/>
  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <g opacity="0.06" stroke="#D89A55" stroke-width="1" fill="none">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
  </g>
  <rect x="0" y="540" width="1600" height="360" fill="url(#floorGrad)"/>
  <rect width="1600" height="900" fill="url(#bgVignette)"/>
  
  <g transform="translate(900, 140)" filter="url(#ds-soft)">
    <!-- back plate (darker, slight offset for stacked sign look) -->
    <rect x="6" y="8" width="660" height="170" rx="10" fill="#0B2447" opacity="0.9"/>
    <!-- main plaque -->
    <rect x="0" y="0" width="660" height="170" rx="10" fill="url(#signGrad)"/>
    <!-- top brand strip -->
    <rect x="0" y="0" width="660" height="34" rx="10" fill="#19376D"/>
    <rect x="0" y="22" width="660" height="12" fill="#19376D"/>
    <rect x="0" y="32" width="660" height="3" fill="#E6A23C"/>
    <!-- top eyebrow -->
    <text x="330.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#F4C77F" letter-spacing="5">SPIN IT UP · PICKUP &amp; DELIVERY</text>
    <!-- inner border -->
    <rect x="14" y="48" width="632" height="108" fill="none" stroke="#E6A23C" stroke-width="1.5" opacity="0.6"/>
    <!-- decorative corner accents -->
    <g fill="#E6A23C" opacity="0.7">
      <circle cx="24" cy="58" r="3"/>
      <circle cx="636" cy="58" r="3"/>
      <circle cx="24" cy="146" r="3"/>
      <circle cx="636" cy="146" r="3"/>
    </g>
    <!-- name (the headliner) -->
    <text x="330.0" y="107.0" text-anchor="middle"
          font-family="Georgia, serif" font-weight="800" font-size="48"
          fill="#0B2447" letter-spacing="3">ALBANY PARK</text>
    <!-- subline -->
    <text x="330.0" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#7C8699" letter-spacing="3">FREE DELIVERY · SAME-DAY AVAILABLE</text>
  </g>
