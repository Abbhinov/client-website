    <line x1="105" y1="-30" x2="115" y2="-30" stroke="#0B2447" stroke-width="1"/>
    <!-- side branding -->
    <text x="60" y="-20" font-family="Georgia, serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="1">SPIN IT UP</text>
    <text x="60" y="-2" font-family="sans-serif" font-size="9" fill="#F4C77F" letter-spacing="3">LAUNDRY · PICKUP &amp; DELIVERY</text>
    <!-- small circular icon on the door -->
    <circle cx="155" cy="18" r="14" fill="#E6A23C"/>
    <circle cx="155" cy="18" r="9" fill="#FFFFFF"/>
    <circle cx="155" cy="18" r="4" fill="#19376D"/>
    <!-- wheels -->
