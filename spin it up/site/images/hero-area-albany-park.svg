  <g stroke="#3D4A5C" fill="#3D4A5C" opacity="0.6">
    <line x1="1060" y1="580" x2="1060" y2="640" stroke-width="2"/>
    <circle cx="1060" cy="578" r="5" fill="#F4C77F"/>
    <line x1="1290" y1="580" x2="1290" y2="640" stroke-width="2"/>
    <circle cx="1290" cy="578" r="5" fill="#F4C77F"/>
