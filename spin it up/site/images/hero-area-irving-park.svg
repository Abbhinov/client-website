    <circle cx="155" cy="18" r="9" fill="#FFFFFF"/>
    <circle cx="155" cy="18" r="4" fill="#19376D"/>
    <!-- wheels -->
    <circle cx="42" cy="50" r="22" fill="#0A1A3D"/>
    <circle cx="42" cy="50" r="14" fill="#A8B5C5"/>
    <circle cx="42" cy="50" r="6" fill="#1B2330"/>
    <path d="M 42 38 v 24 M 30 50 h 24" stroke="#1B2330" stroke-width="1" opacity="0.6"/>
    <circle cx="225" cy="50" r="22" fill="#0A1A3D"/>
    <circle cx="225" cy="50" r="14" fill="#A8B5C5"/>
    <circle cx="225" cy="50" r="6" fill="#1B2330"/>
    <path d="M 225 38 v 24 M 213 50 h 24" stroke="#1B2330" stroke-width="1" opacity="0.6"/>
    <!-- headlight glow -->
    <circle cx="288" cy="14" r="6" fill="#F4C77F"/>
    <circle cx="295" cy="20" r="18" fill="#F4C77F" opacity="0.30" filter="url(#glow-amber)"/>
