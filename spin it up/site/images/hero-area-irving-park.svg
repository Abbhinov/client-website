<rect x="1340" y="490" width="100" height="70" fill="url(#skylineGrad)" stroke="#0A1730" stroke-width="1"/>
  <path d="M 1336 490 L 1390.0 462 L 1444 490 Z" fill="#091226" stroke="#000" stroke-width="1"/>
  <rect x="1350" y="510" width="16" height="22" fill="#1B2E5A" opacity="1"/>
  <rect x="1414" y="510" width="16" height="22" fill="#F4C77F" opacity="0.85"/>
  <rect x="1384.0" y="532" width="12" height="28" fill="#0A1730"/>
<rect x="1460" y="440" width="80" height="120" fill="url(#skylineGrad)" stroke="#0A1730" stroke-width="1"/>
