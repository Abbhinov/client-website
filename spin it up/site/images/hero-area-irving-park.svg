  <g transform="translate(1100, 660)" filter="url(#ds-soft)">
    <!-- ground shadow -->
    <ellipse cx="155" cy="120" rx="170" ry="14" fill="#000" opacity="0.55"/>
    <!-- back cargo box -->
    <rect x="-10" y="-90" width="240" height="130" rx="8" fill="url(#vanBody)" stroke="#0B2447" stroke-width="1.5"/>
    <!-- top stripe -->
    <rect x="-10" y="-90" width="240" height="22" fill="#19376D"/>
    <!-- cab section (slants forward) -->
    <path d="M 230 -90 L 290 -50 L 290 40 L 230 40 Z" fill="url(#vanBody)" stroke="#0B2447" stroke-width="1.5"/>
    <!-- windshield -->
    <path d="M 230 -88 L 285 -50 L 285 -16 L 230 -16 Z" fill="#7BA4D6" opacity="0.75"/>
    <line x1="230" y1="-50" x2="285" y2="-50" stroke="#0B2447" stroke-width="1.5"/>
    <!-- door seam -->
    <line x1="105" y1="-90" x2="105" y2="40" stroke="#0B2447" stroke-width="1.5"/>
    <line x1="105" y1="-30" x2="115" y2="-30" stroke="#0B2447" stroke-width="1"/>
    <!-- side branding -->
    <text x="60" y="-20" font-family="Georgia, serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="1">SPIN IT UP</text>
    <text x="60" y="-2" font-family="sans-serif" font-size="9" fill="#F4C77F" letter-spacing="3">LAUNDRY · PICKUP &amp; DELIVERY</text>
    <!-- small circular icon on the door -->
