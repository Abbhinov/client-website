  <g opacity="0.5">
    <line x1="880" y1="395" x2="1600" y2="395" stroke="#3D4A5C" stroke-width="4"/>
    <line x1="880" y1="408" x2="1600" y2="408" stroke="#3D4A5C" stroke-width="2"/>
    <g fill="#3D4A5C">
