<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
<title id="t">Service areas</title>
<desc id="d">Illustration of a neighborhood map with location pins</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A1A3D"/><stop offset="100%" stop-color="#142A55"/>
