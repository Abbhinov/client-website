  </radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#576CBC"/><stop offset="55%" stop-color="#19376D"/><stop offset="100%" stop-color="#0B2447"/>
  </linearGradient>
