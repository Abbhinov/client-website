<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
<title id="t">Frequently Asked Questions</title>
<desc id="d">Illustration of question-and-answer speech bubbles</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A1A3D"/><stop offset="100%" stop-color="#142A55"/>
  </linearGradient>
  <radialGradient id="glow" cx="80%" cy="16%" r="70%">
    <stop offset="0%" stop-color="#D89A55" stop-opacity="0.34"/>
    <stop offset="38%" stop-color="#3A6FB0" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0A1A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="48%" r="80%">
    <stop offset="58%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
  </radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#576CBC"/><stop offset="55%" stop-color="#19376D"/><stop offset="100%" stop-color="#0B2447"/>
  </linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F4C77F"/><stop offset="55%" stop-color="#E6A23C"/><stop offset="100%" stop-color="#B07820"/>
  </linearGradient>
  <radialGradient id="glass" cx="36%" cy="28%" r="78%">
    <stop offset="0%" stop-color="#EAF3FF" stop-opacity="0.95"/>
    <stop offset="55%" stop-color="#7BA4D6" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1E3458" stop-opacity="0.95"/>
  </radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
