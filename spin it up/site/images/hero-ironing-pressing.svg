<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Ironing and Pressing Service</title>
  <desc id="d">Steam iron pressing a dress shirt on a board with pressed garments hanging behind</desc>
  
<defs>
  <!-- Full background gradient: deep navy with a warm light glow -->
  <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#0A1A3D"/>
    <stop offset="100%" stop-color="#142A55"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="78%" cy="18%" r="65%">
    <stop offset="0%"  stop-color="#D89A55" stop-opacity="0.35"/>
    <stop offset="35%" stop-color="#3A6FB0" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0A1A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bgVignette" cx="50%" cy="50%" r="80%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>

  <!-- Floor gradient at bottom -->
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#142A55" stop-opacity="0"/>
    <stop offset="60%" stop-color="#091532" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#040A1F" stop-opacity="0.85"/>
  </linearGradient>

  <!-- Chrome / brushed steel -->
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#F4F7FA"/>
    <stop offset="18%" stop-color="#D7DEE8"/>
    <stop offset="48%" stop-color="#A8B5C5"/>
    <stop offset="78%" stop-color="#6E7C92"/>
    <stop offset="100%" stop-color="#3D4A5C"/>
  </linearGradient>
  <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="#3D4A5C"/>
    <stop offset="30%" stop-color="#7888A0"/>
    <stop offset="70%" stop-color="#A8B5C5"/>
    <stop offset="100%" stop-color="#F4F7FA"/>
  </linearGradient>
  <linearGradient id="panelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#202B3E"/>
    <stop offset="100%" stop-color="#1B2330"/>
  </linearGradient>

  <!-- Glass / washer door -->
  <radialGradient id="glassDoor" cx="35%" cy="28%" r="75%">
    <stop offset="0%"  stop-color="#EAF3FF" stop-opacity="0.95"/>
    <stop offset="22%" stop-color="#C7DBF2" stop-opacity="0.85"/>
    <stop offset="55%" stop-color="#7BA4D6" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#1E3458" stop-opacity="0.95"/>
  </radialGradient>
  <linearGradient id="doorRing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#C5CCD8"/>
    <stop offset="50%" stop-color="#7A8497"/>
    <stop offset="100%" stop-color="#1B2330"/>
  </linearGradient>

  <!-- LCD display -->
  <linearGradient id="lcdGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#0E1A2F"/>
    <stop offset="100%" stop-color="#1E3458"/>
  </linearGradient>

  <!-- Linen / white fabric -->
  <linearGradient id="linenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#F8F4EC"/>
    <stop offset="100%" stop-color="#E4DDC9"/>
  </linearGradient>

  <!-- Wicker basket -->
  <linearGradient id="wickerLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#DBB07A"/>
    <stop offset="100%" stop-color="#9F7541"/>
  </linearGradient>
  <radialGradient id="wickerBowl" cx="50%" cy="30%" r="70%">
    <stop offset="0%"  stop-color="#DBB07A"/>
    <stop offset="60%" stop-color="#9F7541"/>
    <stop offset="100%" stop-color="#5D4220"/>
  </radialGradient>

  <!-- Drop shadows -->
  <filter id="ds-soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dy="14"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ds-tight" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dy="6"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-warm" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="steam-blur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>
  
  <!-- Full background -->
  <rect width="1600" height="900" fill="url(#bgBase)"/>
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Subtle horizontal light streaks (very faint) -->
  <g opacity="0.06" stroke="#D89A55" stroke-width="1" fill="none">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
  </g>

  <!-- Floor wash at bottom for grounding -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#floorGrad)"/>

  <!-- Vignette to focus the eye on the right -->
  <rect width="1600" height="900" fill="url(#bgVignette)"/>
  
  <g opacity="0.6">
    <!-- horizontal bar -->
    <line x1="780" y1="180" x2="1560" y2="180" stroke="#A8B5C5" stroke-width="4"/>
    <line x1="780" y1="180" x2="1560" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    
    <g transform="translate(840, 180)">
      <!-- hanger -->
      <path d="M 0 0 q 0 -14 12 -14 q 12 0 12 12" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <path d="M 12 10 L -38 48 L 62 48 Z" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <!-- shoulders / yoke -->
      <path d="M -42 45 Q -50 70 -48 100 L -28 95 L -10 75 Q 12 80 34 75 L 52 95 L 72 100 Q 70 70 62 45 Z"
            fill="#A8C5E4" opacity="0.75"/>
      <!-- collar V -->
      <path d="M -10 75 L 12 92 L 34 75 L 26 70 L 12 78 L -2 70 Z" fill="#A8C5E4" opacity="0.44999999999999996"/>
      <!-- body -->
      <path d="M -48 100 L -52 230 L -22 240 L -22 100 Z" fill="#A8C5E4" opacity="0.75"/>
      <path d="M 52 100 L 56 230 L 26 240 L 26 100 Z" fill="#A8C5E4" opacity="0.75"/>
      <path d="M -22 100 L -22 245 L 26 245 L 26 100 Z" fill="#A8C5E4" opacity="0.6900000000000001"/>
      <!-- button placket -->
      <line x1="2" y1="92" x2="2" y2="245" stroke="#000" stroke-width="0.8" opacity="0.4"/>
      <!-- a few subtle wrinkles -->
      <path d="M -42 130 Q -32 180 -42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
      <path d="M 42 130 Q 52 180 42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
    </g>
    
    <g transform="translate(960, 180)">
      <!-- hanger -->
      <path d="M 0 0 q 0 -14 12 -14 q 12 0 12 12" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <path d="M 12 10 L -38 48 L 62 48 Z" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <!-- shoulders / yoke -->
      <path d="M -42 45 Q -50 70 -48 100 L -28 95 L -10 75 Q 12 80 34 75 L 52 95 L 72 100 Q 70 70 62 45 Z"
            fill="#F8F4EC" opacity="0.85"/>
      <!-- collar V -->
      <path d="M -10 75 L 12 92 L 34 75 L 26 70 L 12 78 L -2 70 Z" fill="#F8F4EC" opacity="0.51"/>
      <!-- body -->
      <path d="M -48 100 L -52 230 L -22 240 L -22 100 Z" fill="#F8F4EC" opacity="0.85"/>
      <path d="M 52 100 L 56 230 L 26 240 L 26 100 Z" fill="#F8F4EC" opacity="0.85"/>
      <path d="M -22 100 L -22 245 L 26 245 L 26 100 Z" fill="#F8F4EC" opacity="0.782"/>
      <!-- button placket -->
      <line x1="2" y1="92" x2="2" y2="245" stroke="#000" stroke-width="0.8" opacity="0.4"/>
      <!-- a few subtle wrinkles -->
      <path d="M -42 130 Q -32 180 -42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
      <path d="M 42 130 Q 52 180 42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
    </g>
    
    <g transform="translate(1080, 180)">
      <!-- hanger -->
      <path d="M 0 0 q 0 -14 12 -14 q 12 0 12 12" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <path d="M 12 10 L -38 48 L 62 48 Z" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <!-- shoulders / yoke -->
      <path d="M -42 45 Q -50 70 -48 100 L -28 95 L -10 75 Q 12 80 34 75 L 52 95 L 72 100 Q 70 70 62 45 Z"
            fill="#C97B7B" opacity="0.7"/>
      <!-- collar V -->
      <path d="M -10 75 L 12 92 L 34 75 L 26 70 L 12 78 L -2 70 Z" fill="#C97B7B" opacity="0.42"/>
      <!-- body -->
      <path d="M -48 100 L -52 230 L -22 240 L -22 100 Z" fill="#C97B7B" opacity="0.7"/>
      <path d="M 52 100 L 56 230 L 26 240 L 26 100 Z" fill="#C97B7B" opacity="0.7"/>
      <path d="M -22 100 L -22 245 L 26 245 L 26 100 Z" fill="#C97B7B" opacity="0.644"/>
      <!-- button placket -->
      <line x1="2" y1="92" x2="2" y2="245" stroke="#000" stroke-width="0.8" opacity="0.4"/>
      <!-- a few subtle wrinkles -->
      <path d="M -42 130 Q -32 180 -42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
      <path d="M 42 130 Q 52 180 42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
    </g>
    
    <g transform="translate(1200, 180)">
      <!-- hanger -->
      <path d="M 0 0 q 0 -14 12 -14 q 12 0 12 12" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <path d="M 12 10 L -42 48 L 66 48 Z" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <!-- jacket body with collar and lapels -->
      <path d="M -48 45 L -52 80 L -55 240 L -25 250 L -25 100 L 12 80 L 49 100 L 49 250 L 79 240 L 76 80 L 72 45 L 35 65 L 12 75 L -11 65 Z"
            fill="#1A2436" opacity="0.85"/>
      <!-- lapels -->
      <path d="M -25 100 L -15 80 L 12 75 L 12 100 Z" fill="#1A2436" stroke="#000" stroke-width="0.8" opacity="0.5"/>
      <path d="M 49 100 L 38 80 L 12 75 L 12 100 Z" fill="#1A2436" stroke="#000" stroke-width="0.8" opacity="0.5"/>
      <line x1="12" y1="100" x2="12" y2="250" stroke="#000" stroke-width="1" opacity="0.4"/>
    </g>
    
    <g transform="translate(1320, 180)">
      <!-- hanger -->
      <path d="M 0 0 q 0 -14 12 -14 q 12 0 12 12" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <path d="M 12 10 L -38 48 L 62 48 Z" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <!-- shoulders / yoke -->
      <path d="M -42 45 Q -50 70 -48 100 L -28 95 L -10 75 Q 12 80 34 75 L 52 95 L 72 100 Q 70 70 62 45 Z"
            fill="#8DA88B" opacity="0.75"/>
      <!-- collar V -->
      <path d="M -10 75 L 12 92 L 34 75 L 26 70 L 12 78 L -2 70 Z" fill="#8DA88B" opacity="0.44999999999999996"/>
      <!-- body -->
      <path d="M -48 100 L -52 230 L -22 240 L -22 100 Z" fill="#8DA88B" opacity="0.75"/>
      <path d="M 52 100 L 56 230 L 26 240 L 26 100 Z" fill="#8DA88B" opacity="0.75"/>
      <path d="M -22 100 L -22 245 L 26 245 L 26 100 Z" fill="#8DA88B" opacity="0.6900000000000001"/>
      <!-- button placket -->
      <line x1="2" y1="92" x2="2" y2="245" stroke="#000" stroke-width="0.8" opacity="0.4"/>
      <!-- a few subtle wrinkles -->
      <path d="M -42 130 Q -32 180 -42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
      <path d="M 42 130 Q 52 180 42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
    </g>
    
    <g transform="translate(1440, 180)">
      <!-- hanger -->
      <path d="M 0 0 q 0 -14 12 -14 q 12 0 12 12" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <path d="M 12 10 L -38 48 L 62 48 Z" fill="none" stroke="#A8B5C5" stroke-width="2"/>
      <!-- shoulders / yoke -->
      <path d="M -42 45 Q -50 70 -48 100 L -28 95 L -10 75 Q 12 80 34 75 L 52 95 L 72 100 Q 70 70 62 45 Z"
            fill="#F8F4EC" opacity="0.8"/>
      <!-- collar V -->
      <path d="M -10 75 L 12 92 L 34 75 L 26 70 L 12 78 L -2 70 Z" fill="#F8F4EC" opacity="0.48"/>
      <!-- body -->
      <path d="M -48 100 L -52 230 L -22 240 L -22 100 Z" fill="#F8F4EC" opacity="0.8"/>
      <path d="M 52 100 L 56 230 L 26 240 L 26 100 Z" fill="#F8F4EC" opacity="0.8"/>
      <path d="M -22 100 L -22 245 L 26 245 L 26 100 Z" fill="#F8F4EC" opacity="0.7360000000000001"/>
      <!-- button placket -->
      <line x1="2" y1="92" x2="2" y2="245" stroke="#000" stroke-width="0.8" opacity="0.4"/>
      <!-- a few subtle wrinkles -->
      <path d="M -42 130 Q -32 180 -42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
      <path d="M 42 130 Q 52 180 42 230" stroke="#000" stroke-width="0.6" fill="none" opacity="0.25"/>
    </g>
  </g>

  <g filter="url(#ds-soft)">
    <!-- Board surface (parallelogram for perspective) -->
    <path d="M 700 600
             L 1500 540
             L 1560 580
             L 740 660 Z"
          fill="#F8F4EC" stroke="#A89B7A" stroke-width="1.5"/>
    <!-- Board edge (thin shadow under board) -->
    <path d="M 700 600 L 1500 540 L 1500 552 L 700 612 Z" fill="#A89B7A" opacity="0.4"/>
    <!-- Board cloth pattern hint (subtle stitches) -->
    <g stroke="#A89B7A" stroke-width="1" opacity="0.25" stroke-dasharray="4 6" fill="none">
      <path d="M 720 612 L 1495 552"/>
      <path d="M 720 632 L 1500 572"/>
    </g>
    <!-- Board legs (X-frame) -->
    <line x1="820" y1="650" x2="900" y2="870" stroke="#3D4A5C" stroke-width="6" stroke-linecap="round"/>
    <line x1="900" y1="640" x2="820" y2="870" stroke="#3D4A5C" stroke-width="6" stroke-linecap="round"/>
    <line x1="1320" y1="570" x2="1400" y2="800" stroke="#3D4A5C" stroke-width="6" stroke-linecap="round"/>
    <line x1="1400" y1="560" x2="1320" y2="800" stroke="#3D4A5C" stroke-width="6" stroke-linecap="round"/>
    <!-- floor shadow under board -->
    <ellipse cx="1130" cy="870" rx="430" ry="14" fill="#000" opacity="0.45"/>
  </g>

  <g transform="translate(950, 480)" filter="url(#ds-tight)">
    <!-- shirt body laid flat -->
    <path d="M -150 130
             L -180 100
             L -160 78
             L -120 88
             L -100 60
             Q -70 80 -20 80
             Q 30 80 60 60
             L 80 88
             L 120 78
             L 140 100
             L 110 130
             L 110 200
             L -150 200 Z"
          fill="#F8F4EC" stroke="#A89B7A" stroke-width="2"/>
    <!-- collar -->
    <path d="M -100 60 L -20 95 L 60 60 L 40 50 L -20 70 L -80 50 Z"
          fill="#E4DDC9" stroke="#A89B7A" stroke-width="1.5"/>
    <!-- placket + buttons -->
    <line x1="-20" y1="90" x2="-20" y2="200" stroke="#A89B7A" stroke-width="1.5"/>
    <g fill="#A89B7A">
      <circle cx="-20" cy="110" r="2.5"/>
      <circle cx="-20" cy="135" r="2.5"/>
      <circle cx="-20" cy="160" r="2.5"/>
      <circle cx="-20" cy="185" r="2.5"/>
    </g>
    <!-- pocket -->
    <rect x="-90" y="120" width="44" height="42" rx="2" fill="none" stroke="#A89B7A" stroke-width="1.5"/>
    <!-- realistic fabric shadow / wrinkle hints -->
    <path d="M -130 110 Q -110 130 -100 150" stroke="#A89B7A" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 80 105 Q 95 130 105 155" stroke="#A89B7A" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M -50 175 Q -20 185 10 175" stroke="#A89B7A" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- ironed crisp gleam (specular highlight on the pressed area) -->
    <path d="M -60 100 Q -20 110 50 100 L 50 130 Q -20 140 -60 130 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <g filter="url(#steam-blur)" opacity="0.92">
    <ellipse cx="1010" cy="380" rx="48" ry="28" fill="#EAF3FF"/>
    <ellipse cx="1055" cy="330" rx="38" ry="22" fill="#EAF3FF"/>
    <ellipse cx="1025" cy="280" rx="30" ry="18" fill="#EAF3FF" opacity="0.85"/>
    <ellipse cx="1080" cy="245" rx="24" ry="15" fill="#EAF3FF" opacity="0.7"/>
    <ellipse cx="1050" cy="205" rx="18" ry="12" fill="#EAF3FF" opacity="0.55"/>
    <ellipse cx="1140" cy="335" rx="28" ry="17" fill="#EAF3FF" opacity="0.75"/>
    <ellipse cx="1175" cy="290" rx="20" ry="13" fill="#EAF3FF" opacity="0.6"/>
    <ellipse cx="1200" cy="245" rx="14" ry="10" fill="#EAF3FF" opacity="0.45"/>
  </g>

  <g transform="translate(940, 490) rotate(-10)" filter="url(#ds-soft)">
    <!-- shadow on the shirt under the iron -->
    <ellipse cx="160" cy="90" rx="170" ry="14" fill="#000" opacity="0.35"/>
    <!-- soleplate -->
    <defs>
      <linearGradient id="soleGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#A8B5C5"/>
        <stop offset="60%" stop-color="#6E7C92"/>
        <stop offset="100%" stop-color="#3D4A5C"/>
      </linearGradient>
    </defs>
    <path d="M 0 60
             Q 0 22 40 12
             L 280 12
             Q 340 12 360 60
             L 360 85
             L -8 85
             L 0 60 Z"
          fill="url(#soleGrad)" stroke="#2D3845" stroke-width="2"/>
    <!-- soleplate highlight strip -->
    <path d="M 8 30 Q 40 22 80 24 L 280 24 Q 330 24 348 50"
          stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
    <!-- steam holes -->
    <g fill="#1B2330">
      <circle cx="50"  cy="55" r="3.5"/>
      <circle cx="90"  cy="55" r="3.5"/>
      <circle cx="130" cy="55" r="3.5"/>
      <circle cx="170" cy="55" r="3.5"/>
      <circle cx="210" cy="55" r="3.5"/>
      <circle cx="250" cy="55" r="3.5"/>
      <circle cx="290" cy="55" r="3.5"/>
    </g>
    <!-- main shell (colored body) -->
    <defs>
      <linearGradient id="ironShell" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#576CBC"/>
        <stop offset="55%" stop-color="#19376D"/>
        <stop offset="100%" stop-color="#0B2447"/>
      </linearGradient>
    </defs>
    <path d="M 28 12
             Q 35 -40 100 -55
             L 250 -55
             Q 310 -55 320 -10
             Q 325 6 320 12 Z"
          fill="url(#ironShell)" stroke="#0B2447" stroke-width="2"/>
    <!-- shell highlight -->
    <path d="M 45 5 Q 60 -38 110 -48" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.45"/>
    <path d="M 280 5 Q 295 -25 305 -10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- handle -->
    <path d="M 88 -55 Q 105 -135 175 -135 Q 250 -135 268 -55"
          fill="none" stroke="#0A1A3D" stroke-width="16" stroke-linecap="round"/>
    <path d="M 95 -55 Q 112 -125 175 -125 Q 245 -125 261 -55"
          fill="none" stroke="#E6A23C" stroke-width="9" stroke-linecap="round"/>
    <path d="M 100 -55 Q 116 -118 175 -118"
          fill="none" stroke="#F4C77F" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- water tank window -->
    <rect x="55" y="-30" width="58" height="26" rx="5" fill="#EAF3FF" opacity="0.65" stroke="#0B2447" stroke-width="1.5"/>
    <line x1="60" y1="-14" x2="108" y2="-14" stroke="#19376D" stroke-width="1" opacity="0.6"/>
    <!-- temp dial -->
    <circle cx="210" cy="-20" r="16" fill="#FFFFFF" stroke="#0A1A3D" stroke-width="2"/>
    <circle cx="210" cy="-20" r="12" fill="#F0F4F8"/>
    <rect x="208.5" y="-32" width="3" height="10" rx="1" fill="#C46A5C"/>
    <circle cx="206" cy="-23" r="2.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- LED indicator -->
    <circle cx="258" cy="-20" r="6" fill="#C46A5C"/>
    <circle cx="258" cy="-20" r="11" fill="#C46A5C" opacity="0.35" filter="url(#glow-warm)"/>
  </g>
</svg>