<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Pickup and Delivery service</title>
  <desc id="d">Smartphone with the Spin It Up app, a tagged laundry bag, and a delivery van silhouette</desc>
  
<defs>
  <!-- Full background gradient: deep navy with a warm light glow -->
  <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#0A1A3D"/>
    <stop offset="100%" stop-color="#142A55"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="78%" cy="18%" r="65%">
    <stop offset="0%"  stop-color="#D89A55" stop-opacity="0.35"/>
    <stop offset="35%" stop-color="#3A6FB0" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0A1A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bgVignette" cx="50%" cy="50%" r="80%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>

  <!-- Floor gradient at bottom -->
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#142A55" stop-opacity="0"/>
    <stop offset="60%" stop-color="#091532" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#040A1F" stop-opacity="0.85"/>
  </linearGradient>

  <!-- Chrome / brushed steel -->
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#F4F7FA"/>
    <stop offset="18%" stop-color="#D7DEE8"/>
    <stop offset="48%" stop-color="#A8B5C5"/>
    <stop offset="78%" stop-color="#6E7C92"/>
    <stop offset="100%" stop-color="#3D4A5C"/>
  </linearGradient>
  <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="#3D4A5C"/>
    <stop offset="30%" stop-color="#7888A0"/>
    <stop offset="70%" stop-color="#A8B5C5"/>
    <stop offset="100%" stop-color="#F4F7FA"/>
  </linearGradient>
  <linearGradient id="panelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#202B3E"/>
    <stop offset="100%" stop-color="#1B2330"/>
  </linearGradient>

  <!-- Glass / washer door -->
  <radialGradient id="glassDoor" cx="35%" cy="28%" r="75%">
    <stop offset="0%"  stop-color="#EAF3FF" stop-opacity="0.95"/>
    <stop offset="22%" stop-color="#C7DBF2" stop-opacity="0.85"/>
    <stop offset="55%" stop-color="#7BA4D6" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#1E3458" stop-opacity="0.95"/>
  </radialGradient>
  <linearGradient id="doorRing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#C5CCD8"/>
    <stop offset="50%" stop-color="#7A8497"/>
    <stop offset="100%" stop-color="#1B2330"/>
  </linearGradient>

  <!-- LCD display -->
  <linearGradient id="lcdGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#0E1A2F"/>
    <stop offset="100%" stop-color="#1E3458"/>
  </linearGradient>

  <!-- Linen / white fabric -->
  <linearGradient id="linenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#F8F4EC"/>
    <stop offset="100%" stop-color="#E4DDC9"/>
  </linearGradient>

  <!-- Wicker basket -->
  <linearGradient id="wickerLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#DBB07A"/>
    <stop offset="100%" stop-color="#9F7541"/>
  </linearGradient>
  <radialGradient id="wickerBowl" cx="50%" cy="30%" r="70%">
    <stop offset="0%"  stop-color="#DBB07A"/>
    <stop offset="60%" stop-color="#9F7541"/>
    <stop offset="100%" stop-color="#5D4220"/>
  </radialGradient>

  <!-- Drop shadows -->
  <filter id="ds-soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dy="14"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ds-tight" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dy="6"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-warm" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="steam-blur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>
  
  <!-- Full background -->
  <rect width="1600" height="900" fill="url(#bgBase)"/>
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Subtle horizontal light streaks (very faint) -->
  <g opacity="0.06" stroke="#D89A55" stroke-width="1" fill="none">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
  </g>

  <!-- Floor wash at bottom for grounding -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#floorGrad)"/>

  <!-- Vignette to focus the eye on the right -->
  <rect width="1600" height="900" fill="url(#bgVignette)"/>
  
  <g opacity="0.20" fill="#0B2447">
    <path d="M 700 620 L 700 540 L 740 540 L 740 520 L 780 520 L 780 540 L 820 540
             L 820 500 L 860 500 L 860 540 L 920 540 L 920 510 L 970 510 L 970 540
             L 1010 540 L 1010 480 L 1060 480 L 1060 540 L 1110 540 L 1110 520
             L 1160 520 L 1160 540 L 1220 540 L 1220 500 L 1280 500 L 1280 540
             L 1340 540 L 1340 520 L 1400 520 L 1400 540 L 1460 540 L 1460 510
             L 1520 510 L 1520 540 L 1600 540 L 1600 620 Z"/>
  </g>
  <!-- tiny window dots in the silhouette -->
  <g fill="#F4C77F" opacity="0.35">
    <rect x="752" y="528" width="3" height="3"/>
    <rect x="828" y="510" width="3" height="3"/>
    <rect x="1020" y="500" width="3" height="3"/>
    <rect x="1170" y="528" width="3" height="3"/>
    <rect x="1290" y="510" width="3" height="3"/>
    <rect x="1410" y="528" width="3" height="3"/>
  </g>

  <g transform="translate(1050, 580)" filter="url(#ds-soft)">
    <!-- van body -->
    <rect x="-160" y="-90" width="280" height="130" rx="10" fill="#576CBC"/>
    <rect x="-160" y="-90" width="280" height="22" fill="#19376D"/>
    <!-- cab section -->
    <path d="M 120 -90 L 170 -55 L 170 40 L 120 40 Z" fill="#576CBC"/>
    <!-- windshield -->
    <path d="M 120 -88 L 165 -55 L 165 -20 L 120 -20 Z" fill="#7BA4D6" opacity="0.7"/>
    <line x1="120" y1="-55" x2="165" y2="-55" stroke="#19376D" stroke-width="1.5"/>
    <!-- side door panel line -->
    <line x1="20" y1="-90" x2="20" y2="40" stroke="#19376D" stroke-width="2"/>
    <!-- van branding -->
    <text x="-100" y="-15" font-family="Georgia, serif" font-weight="800" font-size="20" fill="#FFFFFF">SPIN IT UP</text>
    <text x="-100" y="5" font-family="sans-serif" font-size="10" fill="#F4C77F" letter-spacing="2">PICKUP &amp; DELIVERY</text>
    <!-- a little laundry icon -->
    <circle cx="60" cy="-2" r="14" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="-2" r="8" fill="#576CBC"/>
    <!-- wheels -->
    <circle cx="-90" cy="50" r="22" fill="#0A1A3D"/>
    <circle cx="-90" cy="50" r="10" fill="#A8B5C5"/>
    <circle cx="-90" cy="50" r="5" fill="#1B2330"/>
    <circle cx="90" cy="50" r="22" fill="#0A1A3D"/>
    <circle cx="90" cy="50" r="10" fill="#A8B5C5"/>
    <circle cx="90" cy="50" r="5" fill="#1B2330"/>
    <!-- headlight glow -->
    <circle cx="168" cy="20" r="6" fill="#F4C77F"/>
    <circle cx="168" cy="20" r="16" fill="#F4C77F" opacity="0.25" filter="url(#glow-warm)"/>
  </g>

  <path d="M 1240 300 Q 1430 460 1340 600 Q 1240 700 920 700"
        fill="none" stroke="#F4C77F" stroke-width="3"
        stroke-dasharray="12 10" stroke-linecap="round" opacity="0.85"/>
  <!-- destination pin at the end of route -->
  <g transform="translate(920, 700)">
    <circle r="10" fill="#E6A23C" filter="url(#glow-warm)" opacity="0.4"/>
    <circle r="6" fill="#E6A23C"/>
    <circle r="3" fill="#FFFFFF"/>
  </g>

  <g transform="translate(770, 540)" filter="url(#ds-soft)">
    <!-- ground shadow -->
    <ellipse cx="120" cy="280" rx="135" ry="18" fill="#000" opacity="0.5"/>
    <!-- main body of the sack with side shading -->
    <defs>
      <linearGradient id="sackGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0B2447"/>
        <stop offset="35%" stop-color="#19376D"/>
        <stop offset="65%" stop-color="#576CBC"/>
        <stop offset="100%" stop-color="#0B2447"/>
      </linearGradient>
    </defs>
    <path d="M 30 80
             C 0 105, -10 200, 25 270
             C 60 305, 200 305, 235 270
             C 270 200, 260 105, 230 80
             C 215 70, 195 65, 130 65
             C 65 65, 45 70, 30 80 Z"
          fill="url(#sackGrad)"/>
    <!-- highlight along the left curve -->
    <path d="M 40 90 C 30 140, 30 220, 60 275" stroke="#576CBC"
          stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 220 90 C 230 140, 230 220, 200 275" stroke="#0B2447"
          stroke-width="8" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- gathered top (dark cinched neck) -->
    <ellipse cx="130" cy="55" rx="58" ry="18" fill="#0B2447"/>
    <!-- gathered ripples -->
    <path d="M 80 55 Q 90 38 100 50 Q 110 32 120 48 Q 130 30 140 48 Q 150 36 160 55"
          fill="none" stroke="#19376D" stroke-width="3" stroke-linecap="round"/>
    <!-- drawstring ties -->
    <path d="M 88 50 Q 70 28 60 60" fill="none" stroke="#E6A23C" stroke-width="4" stroke-linecap="round"/>
    <path d="M 172 50 Q 190 25 200 55" fill="none" stroke="#E6A23C" stroke-width="4" stroke-linecap="round"/>
    <!-- ID tag swinging from the drawstring -->
    <g transform="translate(180, 95) rotate(15)">
      <line x1="0" y1="-30" x2="0" y2="0" stroke="#E6A23C" stroke-width="2"/>
      <rect x="-26" y="0" width="52" height="32" rx="3" fill="#F8F4EC" stroke="#3A4456" stroke-width="1.5"/>
      <circle cx="0" cy="6" r="2.5" fill="#3A4456"/>
      <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="800" fill="#3A4456" letter-spacing="0.6">SPIN IT UP</text>
      <text x="0" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="800" fill="#19376D">#1842</text>
    </g>
  </g>

  <g transform="translate(1190, 140) rotate(-5)" filter="url(#ds-soft)">
    <!-- phone outer body -->
    <rect x="-4" y="-4" width="268" height="478" rx="40" fill="#000" opacity="0.4"/>
    <rect x="0" y="0" width="260" height="470" rx="36" fill="#1A2436"/>
    <!-- bezel highlight -->
    <rect x="3" y="3" width="254" height="464" rx="33" fill="none" stroke="#3D4A5C" stroke-width="1"/>
    <!-- screen -->
    <rect x="10" y="10" width="240" height="450" rx="28" fill="#F0F4F8"/>
    <!-- dynamic island -->
    <rect x="100" y="20" width="60" height="14" rx="7" fill="#000"/>

    <!-- Status bar -->
    <text x="28" y="55" font-family="sans-serif" font-size="11" font-weight="700" fill="#0A1A3D">9:41</text>
    <text x="230" y="55" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#0A1A3D">●●●</text>

    <!-- Header band -->
    <rect x="20" y="72" width="220" height="68" rx="14" fill="#19376D"/>
    <rect x="20" y="72" width="220" height="68" rx="14" fill="url(#bgGlow)" opacity="0.4"/>
    <text x="130" y="104" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="20" fill="#FFFFFF">Spin It Up</text>
    <text x="130" y="124" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#F4C77F" letter-spacing="2">PICKUP &amp; DELIVERY</text>

    <!-- Address card -->
    <rect x="20" y="154" width="220" height="60" rx="10" fill="#F1F5F9"/>
    <rect x="20" y="154" width="220" height="60" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="42" cy="184" r="11" fill="#C46A5C"/>
    <path d="M 42 181 v 6 M 39 184 h 6" stroke="#FFFFFF" stroke-width="1.7"/>
    <text x="62" y="178" font-family="sans-serif" font-size="9" font-weight="800" fill="#7C8699" letter-spacing="0.8">PICKUP FROM</text>
    <text x="62" y="196" font-family="sans-serif" font-size="11" font-weight="700" fill="#0A1A3D">2845 N Sawyer Ave</text>
    <text x="62" y="208" font-family="sans-serif" font-size="9" fill="#7C8699">Avondale, Chicago</text>

    <!-- Time card -->
    <rect x="20" y="226" width="220" height="60" rx="10" fill="#F1F5F9"/>
    <rect x="20" y="226" width="220" height="60" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="42" cy="256" r="11" fill="#E6A23C"/>
    <path d="M 42 250 v 6 l 4 3" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <text x="62" y="250" font-family="sans-serif" font-size="9" font-weight="800" fill="#7C8699" letter-spacing="0.8">PICKUP TIME</text>
    <text x="62" y="268" font-family="sans-serif" font-size="11" font-weight="700" fill="#0A1A3D">Today · 4:00 – 5:00 PM</text>
    <text x="62" y="282" font-family="sans-serif" font-size="9" font-weight="800" fill="#5FB07A">● Driver assigned · 12 min away</text>

    <!-- Order summary -->
    <text x="30" y="310" font-family="sans-serif" font-size="10" font-weight="800" fill="#7C8699" letter-spacing="0.8">ORDER</text>
    <line x1="30" y1="318" x2="230" y2="318" stroke="#E2E8F0" stroke-width="1"/>
    <text x="30"  y="338" font-family="sans-serif" font-size="11" fill="#0A1A3D">Wash &amp; Fold · 18 lb</text>
    <text x="230" y="338" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="800" fill="#0A1A3D">$27.00</text>
    <text x="30"  y="358" font-family="sans-serif" font-size="11" fill="#0A1A3D">Delivery</text>
    <text x="230" y="358" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="800" fill="#5FB07A">FREE</text>
    <line x1="30" y1="370" x2="230" y2="370" stroke="#E2E8F0" stroke-width="1"/>
    <text x="30"  y="392" font-family="sans-serif" font-size="11" font-weight="800" fill="#0A1A3D">Total</text>
    <text x="230" y="392" text-anchor="end" font-family="Georgia, serif" font-size="14" font-weight="800" fill="#19376D">$27.00</text>

    <!-- CTA -->
    <rect x="20" y="408" width="220" height="46" rx="23" fill="#E6A23C"/>
    <text x="130" y="437" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="0.5">SCHEDULE PICKUP</text>

    <!-- screen reflection highlight -->
    <path d="M 30 30 Q 110 80 50 200 Q 25 130 30 30 Z" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <g transform="translate(740, 200)" filter="url(#ds-soft)">
    <rect width="330" height="76" rx="16" fill="#F0F4F8"/>
    <circle cx="40" cy="38" r="22" fill="#5FB07A"/>
    <path d="M 28 38 l 8 8 l 14 -15" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="34" font-family="sans-serif" font-size="14" font-weight="800" fill="#0A1A3D">Pickup confirmed</text>
    <text x="74" y="54" font-family="sans-serif" font-size="11" fill="#7C8699">Your driver is on the way · ETA 12 min</text>
  </g>
</svg>