<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
<title id="t">Laundry Pricing</title>
<desc id="d">Illustration of a price tag and a stack of coins</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A1A3D"/><stop offset="100%" stop-color="#142A55"/>
  </linearGradient>
  <radialGradient id="glow" cx="80%" cy="16%" r="70%">
    <stop offset="0%" stop-color="#D89A55" stop-opacity="0.34"/>
    <stop offset="38%" stop-color="#3A6FB0" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0A1A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="48%" r="80%">
