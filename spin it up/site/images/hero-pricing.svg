<rect x="0" y="770" width="1600" height="130" fill="#091532" opacity="0.5"/><line x1="0" y1="770" x2="1600" y2="770" stroke="#576CBC" stroke-width="1" opacity="0.25"/><g transform="rotate(-12 1120 470)" filter="url(#ds)"><path d="M 980,330 L 1230,330 L 1300,470 L 1230,610 L 980,610 Z" fill="url(#amber)"/><circle cx="1018" cy="392" r="26" fill="#0B2447"/><circle cx="1018" cy="392" r="11" fill="#F4C77F"/><text x="1150" y="470" font-family="Georgia, serif" font-size="150" font-weight="700" fill="#0B2447" text-anchor="middle" dominant-baseline="central">$</text></g><path d="M 1010,360 C 1030,250 1120,230 1180,210" fill="none" stroke="#F0F4F8" stroke-width="6" opacity="0.6"/><ellipse cx="900" cy="700" rx="78" ry="26" fill="url(#amber)"/><ellipse cx="900" cy="700" rx="78" ry="26" fill="none" stroke="#B07820" stroke-width="3"/><ellipse cx="900" cy="666" rx="78" ry="26" fill="url(#amber)"/><ellipse cx="900" cy="666" rx="78" ry="26" fill="none" stroke="#B07820" stroke-width="3"/><ellipse cx="900" cy="632" rx="78" ry="26" fill="url(#amber)"/><ellipse cx="900" cy="632" rx="78" ry="26" fill="none" stroke="#B07820" stroke-width="3"/><ellipse cx="900" cy="598" rx="78" ry="26" fill="url(#amber)"/><ellipse cx="900" cy="598" rx="78" ry="26" fill="none" stroke="#B07820" stroke-width="3"/><ellipse cx="900" cy="564" rx="78" ry="26" fill="url(#amber)"/><ellipse cx="900" cy="564" rx="78" ry="26" fill="none" stroke="#B07820" stroke-width="3"/><text x="900" y="560" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#0B2447" text-anchor="middle" dominant-baseline="central">$</text>
