<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Spin It Up Laundry — All Services</title>
  <desc id="d">Washing machine, folded laundry stack, steam iron, and a phone showing the full service menu</desc>
  
<defs>
  <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0A1A3D"/>
    <stop offset="100%" stop-color="#142A55"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="78%" cy="18%" r="65%">
    <stop offset="0%" stop-color="#D89A55" stop-opacity="0.35"/>
    <stop offset="35%" stop-color="#3A6FB0" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#0A1A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bgVignette" cx="50%" cy="50%" r="80%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#142A55" stop-opacity="0"/>
    <stop offset="60%" stop-color="#091532" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#040A1F" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F4F7FA"/>
    <stop offset="18%" stop-color="#D7DEE8"/>
    <stop offset="48%" stop-color="#A8B5C5"/>
    <stop offset="78%" stop-color="#6E7C92"/>
    <stop offset="100%" stop-color="#3D4A5C"/>
  </linearGradient>
  <linearGradient id="chromeSide" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3D4A5C"/>
    <stop offset="30%" stop-color="#7888A0"/>
    <stop offset="70%" stop-color="#A8B5C5"/>
    <stop offset="100%" stop-color="#F4F7FA"/>
  </linearGradient>
  <linearGradient id="panelDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#202B3E"/>
    <stop offset="100%" stop-color="#1B2330"/>
  </linearGradient>
  <radialGradient id="glassDoor" cx="35%" cy="28%" r="75%">
    <stop offset="0%" stop-color="#EAF3FF" stop-opacity="0.95"/>
    <stop offset="22%" stop-color="#C7DBF2" stop-opacity="0.85"/>
    <stop offset="55%" stop-color="#7BA4D6" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#1E3458" stop-opacity="0.95"/>
  </radialGradient>
  <linearGradient id="doorRing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C5CCD8"/>
    <stop offset="50%" stop-color="#7A8497"/>
    <stop offset="100%" stop-color="#1B2330"/>
  </linearGradient>
  <linearGradient id="lcdGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0E1A2F"/>
    <stop offset="100%" stop-color="#1E3458"/>
  </linearGradient>

  <!-- Brick texture pattern for the about page -->
  <pattern id="brickPattern" x="0" y="0" width="80" height="32" patternUnits="userSpaceOnUse">
    <rect width="80" height="32" fill="#8B4F3D"/>
    <rect width="80" height="32" fill="#5C3326" opacity="0.3"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#5C3326" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="80" y2="16" stroke="#5C3326" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="16" stroke="#5C3326" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="0" y2="32" stroke="#5C3326" stroke-width="1.5"/>
    <line x1="80" y1="16" x2="80" y2="32" stroke="#5C3326" stroke-width="1.5"/>
    <rect x="2" y="2" width="36" height="12" fill="#A8624F" opacity="0.25"/>
    <rect x="42" y="2" width="36" height="12" fill="#A8624F" opacity="0.2"/>
    <rect x="2" y="18" width="76" height="12" fill="#A8624F" opacity="0.22"/>
  </pattern>

  <!-- Warm window light gradient (for about) -->
  <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFE2B0" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#E89F4C" stop-opacity="0.75"/>
  </linearGradient>

  <!-- Paper / card -->
  <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F8F4EC"/>
    <stop offset="100%" stop-color="#E4DDC9"/>
  </linearGradient>

  <!-- Map streets gradient -->
  <linearGradient id="mapGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1F345C"/>
    <stop offset="100%" stop-color="#13234A"/>
  </linearGradient>

  <filter id="ds-soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dy="14"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ds-tight" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dy="6"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-warm" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>
  
  <rect width="1600" height="900" fill="url(#bgBase)"/>
  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <g opacity="0.06" stroke="#D89A55" stroke-width="1" fill="none">
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
  </g>
  <rect x="0" y="540" width="1600" height="360" fill="url(#floorGrad)"/>
  <rect width="1600" height="900" fill="url(#bgVignette)"/>
  
  <g transform="translate(1040, 200)" filter="url(#ds-soft)">
    <!-- floor shadow -->
    <ellipse cx="140" cy="560" rx="200" ry="20" fill="#000" opacity="0.55"/>
    <!-- side panel -->
    <path d="M 280 32 L 296 44 L 296 540 L 280 528 Z" fill="url(#chromeSide)"/>
    <!-- main body -->
    <rect x="0" y="32" width="280" height="500" rx="14" fill="url(#chrome)" stroke="#5C6E85" stroke-width="1.5"/>
    <!-- control panel -->
    <rect x="10" y="44" width="260" height="78" rx="8" fill="url(#panelDark)"/>
    <!-- LCD -->
    <rect x="24" y="60" width="96" height="46" rx="4" fill="url(#lcdGrad)" stroke="#000" stroke-width="1"/>
    <text x="72" y="93" text-anchor="middle" font-family="monospace" font-size="22" font-weight="800" fill="#F4C77F">SPIN</text>
    <!-- knob -->
    <circle cx="210" cy="82" r="22" fill="#1B2330"/>
    <circle cx="210" cy="82" r="19" fill="url(#chrome)"/>
    <circle cx="210" cy="82" r="14" fill="#3D4A5C"/>
    <rect x="208.5" y="69" width="3" height="10" rx="1" fill="#E6A23C"/>
    <!-- LED dots -->
    <circle cx="138" cy="68" r="3" fill="#5FB07A"/>
    <circle cx="156" cy="68" r="3" fill="#E6A23C"/>
    <circle cx="174" cy="68" r="3" fill="#C46A5C"/>
    <!-- brand strip -->
    <rect x="10" y="130" width="260" height="4" fill="#E6A23C"/>
    <text x="140" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#3A4456" letter-spacing="4">SPIN IT UP</text>
    <!-- door bezel -->
    <circle cx="140" cy="330" r="128" fill="#7A8497"/>
    <circle cx="140" cy="330" r="122" fill="url(#doorRing)"/>
    <circle cx="140" cy="330" r="108" fill="#1B2330"/>
    <circle cx="140" cy="330" r="102" fill="url(#glassDoor)"/>
    <!-- clothes inside -->
    <g transform="translate(140, 330)">
      <ellipse cx="-28" cy="18" rx="54" ry="36" fill="#C97B7B" opacity="0.85"/>
      <ellipse cx="30" cy="-10" rx="48" ry="34" fill="#A8C5E4" opacity="0.85"/>
      <ellipse cx="18" cy="36" rx="42" ry="24" fill="#8DA88B" opacity="0.75"/>
    </g>
    <!-- highlight -->
    <ellipse cx="100" cy="285" rx="38" ry="18" fill="#FFFFFF" opacity="0.45"/>
    <!-- handle -->
    <rect x="265" y="318" width="14" height="24" rx="3" fill="url(#chromeSide)"/>
    <!-- coin/card reader -->
    <rect x="30" y="475" width="220" height="38" rx="6" fill="#1E2A40" stroke="#3D4A5C" stroke-width="1"/>
    <rect x="44" y="485" width="50" height="18" rx="2" fill="#1B2330"/>
    <text x="69" y="498" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#F4C77F">CARD</text>
    <rect x="102" y="485" width="50" height="18" rx="2" fill="#576CBC"/>
    <text x="127" y="498" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF">EBT</text>
    <circle cx="230" cy="494" r="4" fill="#5FB07A"/>
    <!-- kick plate -->
    <rect x="-4" y="528" width="304" height="18" rx="3" fill="#1B2330"/>
  </g>
<g filter="url(#ds-soft)">
<rect x="1408.0" y="660.0" width="172" height="35.0" rx="3" fill="#6A8FB8"/>
<path d="M 1408.0 660.0 L 1414.0 651 L 1586.0 651 L 1580.0 660.0 Z" fill="#A8C5E4"/>
<path d="M 1580.0 660.0 L 1586.0 651 L 1586.0 684.0 L 1580.0 693 Z" fill="#3D5B82"/>
<line x1="1416.0" y1="676.0" x2="1572.0" y2="676.0" stroke="#3D5B82" stroke-width="1" opacity="0.5"/>
<rect x="1400.0" y="619.0" width="174" height="32.0" rx="3" fill="#C9C1AB"/>
<path d="M 1400.0 619.0 L 1406.0 611 L 1580.0 611 L 1574.0 619.0 Z" fill="#F8F4EC"/>
<path d="M 1574.0 619.0 L 1580.0 611 L 1580.0 641.0 L 1574.0 649 Z" fill="#7C7458"/>
<line x1="1408.0" y1="634.0" x2="1566.0" y2="634.0" stroke="#7C7458" stroke-width="1" opacity="0.5"/>
<rect x="1412.0" y="577.0" width="168" height="34.0" rx="3" fill="#A0584C"/>
<path d="M 1412.0 577.0 L 1418.0 569 L 1586.0 569 L 1580.0 577.0 Z" fill="#C97B7B"/>
<path d="M 1580.0 577.0 L 1586.0 569 L 1586.0 601.0 L 1580.0 609 Z" fill="#6B3328"/>
<line x1="1420.0" y1="593.0" x2="1572.0" y2="593.0" stroke="#6B3328" stroke-width="1" opacity="0.5"/>
<rect x="1400.0" y="537.0" width="172" height="32.0" rx="3" fill="#C9C1AB"/>
<path d="M 1400.0 537.0 L 1406.0 529 L 1578.0 529 L 1572.0 537.0 Z" fill="#F8F4EC"/>
<path d="M 1572.0 537.0 L 1578.0 529 L 1578.0 559.0 L 1572.0 567 Z" fill="#7C7458"/>
<line x1="1408.0" y1="552.0" x2="1564.0" y2="552.0" stroke="#7C7458" stroke-width="1" opacity="0.5"/>
</g>

  <g transform="translate(1430, 510) rotate(-8)" filter="url(#ds-tight)">
    <!-- soleplate -->
    <path d="M 0 30 Q 0 10 18 6 L 110 6 Q 140 6 150 30 L 150 42 L -2 42 L 0 30 Z"
          fill="#A8B5C5" stroke="#3D4A5C" stroke-width="1.5"/>
    <!-- shell -->
    <path d="M 12 6 Q 18 -18 50 -22 L 100 -22 Q 130 -22 138 -4 Q 140 4 138 6 Z" fill="#19376D" stroke="#0B2447" stroke-width="1.5"/>
    <!-- handle -->
    <path d="M 36 -22 Q 50 -54 75 -54 Q 100 -54 116 -22" fill="none" stroke="#0A1A3D" stroke-width="9" stroke-linecap="round"/>
    <path d="M 40 -22 Q 54 -48 75 -48 Q 96 -48 112 -22" fill="none" stroke="#E6A23C" stroke-width="5" stroke-linecap="round"/>
    <!-- LED -->
    <circle cx="108" cy="-8" r="3" fill="#C46A5C"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="1495" cy="475" rx="14" ry="9" fill="#EAF3FF"/>
    <ellipse cx="1515" cy="450" rx="10" ry="7" fill="#EAF3FF" opacity="0.7"/>
    <ellipse cx="1500" cy="425" rx="7" ry="5" fill="#EAF3FF" opacity="0.5"/>
  </g>

  <g transform="translate(905, 540) rotate(-8)" filter="url(#ds-soft)">
    <rect x="0" y="0" width="130" height="240" rx="22" fill="#1A2436" stroke="#3D4A5C" stroke-width="1"/>
    <rect x="6" y="6" width="118" height="228" rx="18" fill="#F0F4F8"/>
    <rect x="50" y="13" width="30" height="8" rx="4" fill="#000"/>
    <!-- header -->
    <rect x="14" y="34" width="102" height="46" rx="6" fill="#19376D"/>
    <text x="65" y="55" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="12" fill="#FFFFFF">Spin It Up</text>
    <text x="65" y="69" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#F4C77F" letter-spacing="1.5">SERVICES</text>
    <!-- service rows -->
    <g font-family="sans-serif" font-size="7" fill="#0A1A3D">
      <rect x="14" y="90" width="102" height="22" rx="4" fill="#F1F5F9"/>
      <circle cx="24" cy="101" r="5" fill="#E6A23C"/>
      <text x="34" y="103.5" font-weight="700">Self-Service</text>
      <rect x="14" y="118" width="102" height="22" rx="4" fill="#F1F5F9"/>
      <circle cx="24" cy="129" r="5" fill="#5FB07A"/>
      <text x="34" y="131.5" font-weight="700">Wash &amp; Fold</text>
      <rect x="14" y="146" width="102" height="22" rx="4" fill="#F1F5F9"/>
      <circle cx="24" cy="157" r="5" fill="#C46A5C"/>
      <text x="34" y="159.5" font-weight="700">Pickup &amp; Delivery</text>
      <rect x="14" y="174" width="102" height="22" rx="4" fill="#F1F5F9"/>
      <circle cx="24" cy="185" r="5" fill="#876FB0"/>
      <text x="34" y="187.5" font-weight="700">Commercial</text>
      <rect x="14" y="202" width="102" height="22" rx="4" fill="#F1F5F9"/>
      <circle cx="24" cy="213" r="5" fill="#576CBC"/>
      <text x="34" y="215.5" font-weight="700">Ironing</text>
    </g>
  </g>

  <g opacity="0.18">
    <ellipse cx="1180" cy="770" rx="380" ry="12" fill="#D89A55"/>
  </g>
</svg>