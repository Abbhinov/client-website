<line x1="1232.0" y1="643.0" x2="1232.0" y2="674" stroke="#7C7458" stroke-width="1" opacity="0.4"/>
<line x1="918.0" y1="630" x2="1266.0" y2="630" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
<rect x="918.0" y="586.0" width="352" height="44.0" rx="3" fill="#6A8FB8"/>
<path d="M 918.0 586.0 L 926.0 576 L 1278.0 576 L 1270.0 586.0 Z" fill="#A8C5E4"/>
<path d="M 1270.0 586.0 L 1278.0 576 L 1278.0 618.0 L 1270.0 628 Z" fill="#3D5B82"/>
<line x1="930.0" y1="608.0" x2="1262.0" y2="608.0" stroke="#3D5B82" stroke-width="1" opacity="0.5"/>
<line x1="1244.0" y1="590.0" x2="1244.0" y2="624" stroke="#3D5B82" stroke-width="1" opacity="0.4"/>
<line x1="926.0" y1="576" x2="1278.0" y2="576" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
<rect x="910.0" y="529.0" width="356" height="47.0" rx="3" fill="#8A7E40"/>
<path d="M 910.0 529.0 L 918.0 518 L 1274.0 518 L 1266.0 529.0 Z" fill="#A89853"/>
<path d="M 1266.0 529.0 L 1274.0 518 L 1274.0 563.0 L 1266.0 574 Z" fill="#574E28"/>
<line x1="922.0" y1="552.0" x2="1258.0" y2="552.0" stroke="#574E28" stroke-width="1" opacity="0.5"/>
<line x1="1240.0" y1="533.0" x2="1240.0" y2="570" stroke="#574E28" stroke-width="1" opacity="0.4"/>
<line x1="918.0" y1="518" x2="1274.0" y2="518" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
<rect x="926.0" y="473.0" width="344" height="45.0" rx="3" fill="#A0584C"/>
<path d="M 926.0 473.0 L 934.0 462 L 1278.0 462 L 1270.0 473.0 Z" fill="#C97B7B"/>
<path d="M 1270.0 473.0 L 1278.0 462 L 1278.0 505.0 L 1270.0 516 Z" fill="#6B3328"/>
<line x1="938.0" y1="495.0" x2="1262.0" y2="495.0" stroke="#6B3328" stroke-width="1" opacity="0.5"/>
<line x1="1244.0" y1="477.0" x2="1244.0" y2="512" stroke="#6B3328" stroke-width="1" opacity="0.4"/>
<line x1="934.0" y1="462" x2="1278.0" y2="462" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
