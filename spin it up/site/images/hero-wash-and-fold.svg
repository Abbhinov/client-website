<line x1="930.0" y1="344" x2="1278.0" y2="344" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>

    <g transform="translate(1180.0, 358)">
      <rect width="76" height="24" rx="3" fill="#E6A23C" opacity="0.95"/>
      <text x="38" y="16" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="10" fill="#0B2447" letter-spacing="1.5">FRESH</text>
    </g>
<rect x="910.0" y="296.0" width="344" height="48.0" rx="3" fill="#6A8FB8"/>
<path d="M 910.0 296.0 L 918.0 284 L 1262.0 284 L 1254.0 296.0 Z" fill="#A8C5E4"/>
<path d="M 1254.0 296.0 L 1262.0 284 L 1262.0 330.0 L 1254.0 342 Z" fill="#3D5B82"/>
<line x1="922.0" y1="319.0" x2="1246.0" y2="319.0" stroke="#3D5B82" stroke-width="1" opacity="0.5"/>
<line x1="1228.0" y1="300.0" x2="1228.0" y2="338" stroke="#3D5B82" stroke-width="1" opacity="0.4"/>
<line x1="918.0" y1="284" x2="1262.0" y2="284" stroke="#FFFFFF" stroke-width="1" opacity="0.45"/>
</g>

  <g transform="translate(830, 580)" filter="url(#ds-soft)">
    <!-- back rim (drawn first, behind body) -->
    <ellipse cx="0" cy="0" rx="180" ry="34" fill="#9F7541"/>
    <ellipse cx="0" cy="-3" rx="172" ry="28" fill="#5D4220"/>
    <!-- body -->
    <path d="M -180 0 Q -180 130 0 145 Q 180 130 180 0 Z" fill="url(#wickerBowl)"/>
    <!-- weave hatching, clipped to body -->
    <clipPath id="basketClip"><path d="M -180 0 Q -180 130 0 145 Q 180 130 180 0 Z"/></clipPath>
    <g clip-path="url(#basketClip)" stroke="#5D4220" stroke-width="1.4" opacity="0.55">
      <!-- vertical strands -->
      <path d="M -170 0 Q -170 100 -170 140" fill="none"/>
      <path d="M -140 0 Q -140 105 -140 140" fill="none"/>
      <path d="M -100 0 Q -100 115 -100 145" fill="none"/>
      <path d="M -60 0 Q -60 120 -60 148" fill="none"/>
      <path d="M -20 0 Q -20 125 -20 150" fill="none"/>
      <path d="M 20 0 Q 20 125 20 150" fill="none"/>
      <path d="M 60 0 Q 60 120 60 148" fill="none"/>
      <path d="M 100 0 Q 100 115 100 145" fill="none"/>
      <path d="M 140 0 Q 140 105 140 140" fill="none"/>
      <path d="M 170 0 Q 170 100 170 140" fill="none"/>
      <!-- horizontal weave rows (curved) -->
      <path d="M -180 18 Q 0 30 180 18" fill="none"/>
      <path d="M -180 44 Q 0 56 180 44" fill="none"/>
      <path d="M -180 70 Q 0 82 180 70" fill="none"/>
      <path d="M -180 96 Q 0 110 180 96" fill="none"/>
      <path d="M -178 120 Q 0 132 178 120" fill="none"/>
    </g>
    <!-- dark inner shadow at the very top to give "opening" depth -->
    <ellipse cx="0" cy="0" rx="170" ry="28" fill="none" stroke="#5D4220" stroke-width="3" opacity="0.55"/>
    <!-- front rim (drawn last to overlap the body top) -->
    <ellipse cx="0" cy="0" rx="180" ry="34" fill="none" stroke="#5D4220" stroke-width="2.5"/>
    <ellipse cx="0" cy="-2" rx="180" ry="32" fill="none" stroke="#DBB07A" stroke-width="2" opacity="0.5"/>
    <!-- handles -->
    <path d="M -175 -5 q -22 -2 -22 -22 q 0 -16 16 -16" fill="none" stroke="#5D4220" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 175 -5 q 22 -2 22 -22 q 0 -16 -16 -16" fill="none" stroke="#5D4220" stroke-width="4.5" stroke-linecap="round"/>
    <!-- a hint of a folded towel poking out of the top of the basket -->
    <rect x="-50" y="-14" width="100" height="20" rx="3" fill="#F8F4EC"/>
    <rect x="-50" y="-14" width="100" height="2" fill="#FFFFFF" opacity="0.5"/>
    <line x1="-30" y1="-2" x2="30" y2="-2" stroke="#A89B7A" stroke-width="1" opacity="0.4"/>
  </g>

  <g transform="translate(870, 570) rotate(-22)">
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#4A6B4F" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#876FB0">
      <ellipse cx="-4" cy="-118" rx="4" ry="9"/>
      <ellipse cx="4"  cy="-128" rx="4" ry="9"/>
      <ellipse cx="-4" cy="-138" rx="4" ry="9"/>
      <ellipse cx="4"  cy="-146" rx="4" ry="8"/>
      <ellipse cx="-3" cy="-154" rx="3" ry="7"/>
    </g>
    <!-- small leaves -->
    <ellipse cx="-8" cy="-80" rx="4" ry="10" fill="#5C7F62" transform="rotate(-30, -8, -80)"/>
    <ellipse cx="8" cy="-60" rx="4" ry="10" fill="#5C7F62" transform="rotate(30, 8, -60)"/>
  </g>

  <g fill="#F4C77F" opacity="0.7">
    <circle cx="930" cy="240" r="2.5"/>
    <circle cx="1480" cy="320" r="2"/>
    <circle cx="820" cy="430" r="2"/>
    <circle cx="1520" cy="500" r="2.5"/>
  </g>

  <g transform="translate(1280, 200)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#CFD6E0" stroke-width="1.5" opacity="0.85"/>
    <g transform="translate(0, 100)" filter="url(#ds-tight)">
      <path d="M -64 0 L 52 0 L 74 26 L 52 52 L -64 52 L -64 0 Z" fill="#F8F4EC"/>
      <path d="M -64 0 L 52 0 L 74 26 L 52 52 L -64 52 L -64 0 Z" fill="none" stroke="#3A4456" stroke-width="1.5"/>
      <circle cx="-54" cy="26" r="4" fill="#3A4456"/>
      <circle cx="-54" cy="26" r="2" fill="#F8F4EC"/>
      <text x="4" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#3A4456" letter-spacing="2">FROM</text>
      <text x="4" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="800" fill="#19376D">$1.50/lb</text>
    </g>
  </g>
</svg>