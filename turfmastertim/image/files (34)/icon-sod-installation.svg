<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Sod Installation</title>
  <!-- ground line -->
  <rect x="20" y="158" width="160" height="6" rx="2" fill="#8B5A3C" opacity="0.4"/>
  <!-- unrolled flat sod -->
  <rect x="22" y="92" width="100" height="58" rx="3" fill="#8B5A3C"/>
  <rect x="22" y="78" width="100" height="16" fill="#6BAA45"/>
  <!-- grass blades on flat sod -->
  <path d="M30 78 L33 64 L36 78 Z" fill="#A8D17C"/>
  <path d="M48 78 L51 60 L54 78 Z" fill="#A8D17C"/>
  <path d="M66 78 L69 64 L72 78 Z" fill="#A8D17C"/>
  <path d="M84 78 L87 60 L90 78 Z" fill="#A8D17C"/>
  <path d="M102 78 L105 64 L108 78 Z" fill="#A8D17C"/>
  <!-- rolled sod -->
  <ellipse cx="148" cy="120" rx="30" ry="30" fill="#8B5A3C"/>
  <ellipse cx="148" cy="120" rx="30" ry="30" fill="none" stroke="#6B3F26" stroke-width="2"/>
  <path d="M122 100 Q148 88 174 100" stroke="#6BAA45" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="148" cy="120" rx="18" ry="18" fill="none" stroke="#6B3F26" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="148" cy="120" rx="8" ry="8" fill="none" stroke="#6B3F26" stroke-width="1.5" opacity="0.4"/>
  <!-- grass tip on top of roll -->
  <path d="M128 92 L130 84 L132 92 Z" fill="#A8D17C"/>
  <path d="M148 88 L150 80 L152 88 Z" fill="#A8D17C"/>
  <path d="M166 92 L168 84 L170 92 Z" fill="#A8D17C"/>
</svg>
