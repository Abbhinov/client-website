<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <title>Edge 2 Hedges — primary logo</title>
  <!-- Grass tuft icon -->
  <g transform="translate(160, 50)">
    <path d="M-38 18 Q-38 -8 -32 -22 Q-26 -8 -28 18 Z" fill="#0F3D24"/>
    <path d="M38 18 Q38 -8 32 -22 Q26 -8 28 18 Z" fill="#0F3D24"/>
    <path d="M-22 20 Q-22 -14 -14 -32 Q-6 -14 -12 20 Z" fill="#1A5A33"/>
    <path d="M22 20 Q22 -14 14 -32 Q6 -14 12 20 Z" fill="#1A5A33"/>
    <path d="M-6 22 Q-6 -18 0 -42 Q6 -18 6 22 Z" fill="#0F3D24"/>
  </g>
  <!-- EDGE — anchored end so the gap is precise -->
  <text x="190" y="118" text-anchor="end" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="#0F3D24" letter-spacing="2">EDGE</text>
  <!-- Gold "2" disc with breathing room from EDGE -->
  <circle cx="216" cy="106" r="13" fill="#D4A744"/>
  <text x="216" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" font-style="italic" fill="#FFFFFF">2</text>
  <!-- HEDGES — focal word -->
  <text x="160" y="184" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="62" font-weight="900" fill="#0F3D24" letter-spacing="3">HEDGES</text>
  <!-- Baseline rule + tagline -->
  <line x1="90" y1="208" x2="230" y2="208" stroke="#0F3D24" stroke-width="2"/>
  <text x="160" y="226" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#0F3D24" letter-spacing="5">BRANDON · FLORIDA</text>
</svg>
